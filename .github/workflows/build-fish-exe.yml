name: Build fish Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'fish-release-*'

permissions:
  contents: write

concurrency:
  group: fish-windows-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # The update popup summarizes commits since the previous release tag.
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve build version
        id: version
        shell: bash
        env:
          PACKAGE_VERSION_MODE: auto
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            import { desktopCiVersion } from './apps/desktop/scripts/desktop-ci-version.mjs'
            const product = JSON.parse(readFileSync('apps/desktop/package.json', 'utf8')).version
            process.stdout.write('version=' + desktopCiVersion(process.env, product) + '\n')
          " >> "$GITHUB_OUTPUT"

      - name: Check update mirror settings
        if: vars.FISH_MIRROR_COS_BUCKET != ''
        shell: bash
        env:
          SECRET_ID: ${{ secrets.FISH_MIRROR_COS_SECRET_ID }}
          SECRET_KEY: ${{ secrets.FISH_MIRROR_COS_SECRET_KEY }}
        run: |
          if [ -z "$SECRET_ID" ] || [ -z "$SECRET_KEY" ]; then
            echo "FISH_MIRROR_COS_BUCKET is set, so FISH_MIRROR_COS_SECRET_ID and FISH_MIRROR_COS_SECRET_KEY are required"
            exit 1
          fi

      - name: Write local packaging settings
        shell: bash
        env:
          MIRROR_BUCKET: ${{ vars.FISH_MIRROR_COS_BUCKET }}
        run: |
          github_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest"
          download_page="$github_url"
          mirror=""
          if [ -n "$MIRROR_BUCKET" ]; then
            mirror="https://${MIRROR_BUCKET}.cos.ap-beijing.myqcloud.com/fish/win-x64/"
            download_page="${mirror}get/latest.exe"
          fi
          cat > apps/desktop/.env.windows <<EOF
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_UPDATE_FEED_URL=${github_url}/download/
          DSH_DESKTOP_UPDATE_DOWNLOAD_PAGE=$download_page
          DSH_DESKTOP_WINDOWS_SIGNATURE_CACHE_CONCURRENCY=4
          EOF
          if [ -n "$mirror" ]; then echo "DSH_DESKTOP_UPDATE_FEED_MIRRORS=$mirror" >> apps/desktop/.env.windows; fi

      - name: Package Windows installer
        run: pnpm run package:desktop:win:x64:unsigned -- --build-version ${{ steps.version.outputs.version }}

      - name: Verify release artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MIRROR_BUCKET: ${{ vars.FISH_MIRROR_COS_BUCKET }}
        run: |
          artifacts=apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts
          installer="$artifacts/deepseek-harness-$VERSION-win-x64-unsigned.exe"
          for file in "$installer" "$installer.blockmap" "$artifacts/nightly.yml" "$artifacts/win-unpacked/resources/app-update.yml"; do
            test -f "$file" || { echo "missing release file: $file"; exit 1; }
          done
          grep -q 'provider: generic' "$artifacts/win-unpacked/resources/app-update.yml"
          grep -q 'releases/latest/download/' "$artifacts/win-unpacked/resources/app-update.yml"
          grep -q "$(basename "$installer")" "$artifacts/nightly.yml"
          notes="$artifacts/win-unpacked/resources/update-notes.json"
          test -f "$notes" || { echo "missing release file: $notes"; exit 1; }
          grep -q "\"version\": \"$VERSION\"" "$notes"
          if [ -n "$MIRROR_BUCKET" ]; then
            asar="$artifacts/win-unpacked/resources/app.asar"
            grep -a -q 'dshDesktopUpdateSources' "$asar" || { echo "packaged manifest has no update sources"; exit 1; }
            grep -a -q "${MIRROR_BUCKET}.cos.ap-beijing.myqcloud.com/fish/win-x64/" "$asar" \
              || { echo "packaged manifest has no mirror source"; exit 1; }
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-fish-windows-installer
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Publish update mirror
        if: vars.FISH_MIRROR_COS_BUCKET != ''
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FISH_MIRROR_COS_BUCKET: ${{ vars.FISH_MIRROR_COS_BUCKET }}
          FISH_MIRROR_COS_SECRET_ID: ${{ secrets.FISH_MIRROR_COS_SECRET_ID }}
          FISH_MIRROR_COS_SECRET_KEY: ${{ secrets.FISH_MIRROR_COS_SECRET_KEY }}
        run: |
          pnpm exec tsx apps/desktop/scripts/publish-fish-mirror.ts \
            --artifacts apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts \
            --version "$VERSION"

      - name: Publish latest GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          artifacts=apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts
          installer="$artifacts/deepseek-harness-$VERSION-win-x64-unsigned.exe"
          gh release create "v$VERSION" \
            "$installer" "$installer.blockmap" "$artifacts/nightly.yml" \
            --target "$GITHUB_SHA" \
            --title "大肥鱼 $VERSION" \
            --notes "Windows 安装包，版本 $VERSION。安装程序会覆盖旧版本；已安装的用户可在应用内检查更新。" \
            --latest
